services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-findoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findoc}
      POSTGRES_DB: ${POSTGRES_DB:-findoc}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies database migrations once, then exits. The API starts only if it succeeded.
  migrate:
    build: .
    command: ["python", "-m", "app.cli", "migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-findoc}:${POSTGRES_PASSWORD:-findoc}@db:5432/${POSTGRES_DB:-findoc}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-findoc}:${POSTGRES_PASSWORD:-findoc}@db:5432/${POSTGRES_DB:-findoc}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-voyage}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      # Source PDFs live on the host; ingestion reads them from here.
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
