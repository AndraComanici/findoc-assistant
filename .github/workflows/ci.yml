name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run tests
        run: pytest

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: findoc
          POSTGRES_PASSWORD: findoc
          POSTGRES_DB: findoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findoc -d findoc_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://findoc:findoc@localhost:5432/findoc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run integration tests
        run: pytest -m integration -v

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait api
      - name: Check readiness
        run: curl -fsS http://localhost:8000/health/ready
      - name: Check that migrations were applied
        run: >-
          docker compose exec -T db
          psql -U findoc -d findoc -v ON_ERROR_STOP=1
          -c "SELECT version FROM schema_migrations"
          -c "SELECT count(*) FROM chunks"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
