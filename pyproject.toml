[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "findoc-assistant"
version = "0.1.0"
description = "Question answering with citations over annual reports of companies listed on the Bucharest Stock Exchange"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "pypdf>=6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2.16",
    "ruff>=0.6",
    "reportlab>=4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a PostgreSQL database with pgvector (set TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
